name: Mobly Test & ATS 2.0 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支援手動點擊觸發

jobs:
  deploy-and-test:
    runs-on: [ self-hosted, ats-2.0-runner ]

    steps:
      # Step 1: Checkout 專案腳本
      - name: Checkout Mobly Test Code
        uses: actions/checkout@v4
        with:
          clean: true

      # Step 2: 同步程式碼至共享目錄並修復權限 (已去除帳號硬編碼)
      - name: Sync Code to Shared Workspace & Fix Permissions
        run: |
          echo "=== [Step 1] 同步測試腳本至 /opt/ats_mobly_workspace ==="
          sudo rsync -rtv --delete --exclude='.git' ./ /opt/ats_mobly_workspace/
          
          # 僅設定共享群組 atsgroup，不硬編碼特定使用者帳號
          sudo chgrp -R atsgroup /opt/ats_mobly_workspace
          sudo chmod -R 775 /opt/ats_mobly_workspace
          sudo chmod g+s /opt/ats_mobly_workspace
          echo "=== 共享目錄同步與權限設定完成 ==="

      # Step 3: 驗證 ATS 2.0 Web UI 服務健康狀態 (Port 8000)
      - name: Verify ATS 2.0 Service Health
        run: |
          echo "=== [Step 2] 檢查 ATS 2.0 服務狀態 (http://127.0.0.1:8000) ==="
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "ATS 2.0 Web 服務運作正常 (HTTP 200 OK)"
          else
            echo "Error: 無法連線至 ATS 2.0 服務，狀態碼: $RESPONSE"
            exit 1
          fi

      # Step 4: 調用 Mobly / Python 執行三星 Tab A8 自動化測試
      - name: Execute Mobly Test on Samsung Tab A8
        run: |
          echo "=== [Step 3] 開始對 Samsung Galaxy Tab A8 執行 Mobly 自動化測試 ==="

          # 切換至共享工作目錄
          cd /opt/ats_mobly_workspace

          # 載入共享目錄下的 Python 虛擬環境 (避免指向個人家目錄)
          source /opt/ats_mobly_workspace/venv/bin/activate
          
          # 執行 Mobly 測試腳本，並指定配置文件
          python3 tests/tab_a8_basic_test.py -c config.yaml
